<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | Urban Store</title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="container header-content">

            <a href="index.html" class="logo">
                URBAN<span>STORE</span>
            </a>

            <nav class="nav" id="nav">

                <a href="index.html">
                    Início
                </a>

                <a href="produtos.html">
                    Produtos
                </a>

                <a href="produtos.html">
                    Categorias
                </a>

                <a href="produtos.html">
                    Ofertas
                </a>

            </nav>

            <div class="header-actions">

                <a href="login.html" class="header-icon">
                    <i class="fa-regular fa-user"></i>
                </a>

                <a href="carrinho.html" class="header-icon cart-icon">

                    <i class="fa-solid fa-bag-shopping"></i>

                    <span id="cart-count">
                        0
                    </span>

                </a>

                <button
                    class="menu-button"
                    id="menu-button">

                    <i class="fa-solid fa-bars"></i>

                </button>

            </div>

        </div>

    </header>


    <!-- LOGIN -->

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-header">

                <span>
                    BEM-VINDO DE VOLTA
                </span>

                <h1>
                    Entrar
                </h1>

                <p>
                    Acesse sua conta para continuar.
                </p>

            </div>


            <form id="login-form" class="auth-form">

                <div class="form-group">

                    <label for="login-email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="seu@email.com"
                        required>

                </div>


                <div class="form-group">

                    <label for="login-password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Digite sua senha"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary auth-button">

                    Entrar

                </button>


                <div
                    id="login-message"
                    class="auth-message">
                </div>

            </form>


            <div class="auth-footer">

                <p>
                    Ainda não possui uma conta?
                </p>

                <a href="cadastro.html">
                    Criar minha conta
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <div class="footer-content">

                <div>

                    <a href="index.html" class="logo">
                        URBAN<span>STORE</span>
                    </a>

                    <p>
                        Seu estilo. Sua identidade.
                    </p>

                </div>

                <div class="footer-links">

                    <a href="produtos.html">
                        Produtos
                    </a>

                    <a href="pedidos.html">
                        Meus pedidos
                    </a>

                    <a href="login.html">
                        Minha conta
                    </a>

                </div>

            </div>

            <div class="footer-bottom">

                <p>
                    © 2026 Urban Store. Todos os direitos reservados.
                </p>

            </div>

        </div>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
