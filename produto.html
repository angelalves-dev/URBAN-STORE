<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Produto | Urban Store</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        .product-page {
            padding: 70px 0 100px;
        }

        .product-detail {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            align-items: center;
        }

        .product-detail-image {
            width: 100%;
            background: #f5f5f5;
            overflow: hidden;
        }

        .product-detail-image img {
            width: 100%;
            display: block;
            aspect-ratio: 4 / 5;
            object-fit: cover;
        }

        .product-detail-info {
            padding: 20px 0;
        }

        .product-detail-info .product-category {
            display: block;
            margin-bottom: 15px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #777;
        }

        .product-detail-info h1 {
            font-size: 42px;
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .product-detail-info p {
            color: #666;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .product-detail-price {
            display: block;
            font-size: 28px;
            margin-bottom: 20px;
            color: #111;
        }

        .stock-info {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 14px;
            background: #f3f3f3;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        .stock-out {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 14px;
            background: #ffe8e8;
            color: #c00000;
            font-size: 14px;
            font-weight: 700;
        }

        #product-add-cart {
            width: 100%;
            max-width: 350px;
            height: 52px;
            border: none;
            background: #111;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            transition: .2s;
        }

        #product-add-cart:hover {
            background: #333;
        }

        @media (max-width: 750px) {

            .product-page {
                padding: 40px 0 70px;
            }

            .product-detail {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .product-detail-info h1 {
                font-size: 32px;
            }

        }

    </style>

</head>

<body>

<header class="header">

    <div class="container header-content">

        <a
            href="index.html"
            class="logo"
        >
            URBAN<span>STORE</span>
        </a>

        <nav
            class="nav"
            id="nav"
        >

            <a href="index.html">
                Início
            </a>

            <a href="produtos.html">
                Produtos
            </a>

            <a href="produtos.html?categoria=camisetas">
                Camisetas
            </a>

            <a href="produtos.html?categoria=calcas">
                Calças
            </a>

            <a href="produtos.html?categoria=tenis">
                Tênis
            </a>

            <a href="produtos.html?categoria=acessorios">
                Acessórios
            </a>

        </nav>

        <div class="header-actions">

            <a
                href="login.html"
                class="header-icon account-link"
            >
                <i class="fa-regular fa-user"></i>
            </a>

            <a
                href="carrinho.html"
                class="header-icon cart-icon"
            >

                <i class="fa-solid fa-bag-shopping"></i>

                <span id="cart-count">
                    0
                </span>

            </a>

            <button
                type="button"
                class="menu-button"
                id="menu-button"
            >
                <i class="fa-solid fa-bars"></i>
            </button>

        </div>

    </div>

</header>


<main class="product-page">

    <div class="container">

        <!-- IMPORTANTE:
             O SCRIPT.JS PROCURA ESTE ID -->
        <div id="product-details">

        </div>

    </div>

</main>


<footer class="footer">

    <div class="container">

        <div class="footer-content">

            <div>

                <a
                    href="index.html"
                    class="logo footer-logo"
                >
                    URBAN<span>STORE</span>
                </a>

                <p>
                    Seu estilo. Sua identidade.
                </p>

            </div>

            <div>

                <h3>
                    Loja
                </h3>

                <a href="produtos.html">
                    Produtos
                </a>

                <a href="pedidos.html">
                    Meus pedidos
                </a>

                    Minha conta
                </a>

            </div>

            <div>

                    Fale conosco
                </a>

                <a href="#">
                    Política de troca
                </a>

                <a href="#">
                    Entrega
                </a>

            </div>

        </div>

        <div class="footer-bottom">

            <p>
                © 2026 Urban Store.
                Todos os direitos reservados.
            </p>

        </div>

    </div>

</footer>


<script src="js/script.js"></script>

</body>

</html>
